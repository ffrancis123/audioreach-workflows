---
name: _process_image
description: Process Image for build url

on:
  workflow_call:
    inputs:
      event_name:
        required: false
        type: string
        description: Optional event name to use for building
        default: ${{ github.event_name }}

      files_to_copy:
        required: false
        type: string
        description: Optional files to copy for building
        default: 'ci/files_to_copy.sh'

      pr_ref:
        required: false
        type: string
        description: Optional pull request reference to use for building
        default: ${{ github.event.pull_request.head.ref }}

      pr_repo:
        required: false
        type: string
        description: Optional pull request repository to use for building
        default: ${{ github.event.pull_request.head.repo.full_name }}

      base_ref:
        required: false
        type: string
        description: Optional base reference to use for building
        default: ${{ github.ref_name }}


      build_matrix:                 # <-- added (required for matrix below)
        required: true
        type: string
        description: JSON string for the build matrix

jobs:
  process_image:
    runs-on:
      group: GHA-AudioReach-SelfHosted-RG
      labels: [ self-hosted, self-hosted, audior-prd-u2204-x64-large-od-ephem ]

    strategy:
      fail-fast: false
      matrix:
        build_matrix: ${{ fromJSON(inputs.build_matrix) }}

    env:
      IMAGE_NAME: ${{ matrix.build_matrix.image_name }}

    steps:
      - name: Build docker Image
        id: get-docker-image
        uses: AudioReach/audioreach-workflows/.github/actions/build_docker_image@master

      - name: Sync Codebase
        id: sync
        uses: AudioReach/audioreach-workflows/.github/actions/sync@master
        with:
          event_name: ${{ inputs.event_name }}
          pr_ref: ${{ inputs.pr_ref }}
          pr_repo: ${{ inputs.pr_repo }}
          base_ref: ${{ inputs.base_ref }}

      - name: Download build artifact
        id: download_build_artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: build_${{ env.IMAGE_NAME }}.tar
          path: ${{ github.workspace }}

      - name: Extract build artifact
        id: extract_build_artifact
        shell: bash
        env:
          WORKSPACE_DIR: ${{ github.workspace }}
          IMAGE_NAME_LOCAL: ${{ env.IMAGE_NAME }}
        run: |
          #!/bin/bash
          set -e

          mkdir -p "${WORKSPACE_DIR}/build"
          echo "Extracting the build artifact"
          tar -xvf "${WORKSPACE_DIR}/build_${IMAGE_NAME_LOCAL}.tar" -C "${WORKSPACE_DIR}/build"
          echo "Build artifact extracted successfully"

      - name: Pull meta-audioreach pre compiled image
        id: pull_meta_audioreach
        if: ${{ env.IMAGE_NAME != 'raspberrypi4' }}
        uses: AudioReach/audioreach-workflows/.github/actions/aws-s3-exchanger@master
        with:
          s3_bucket: qli-prd-audior-gh-artifacts
          mode: download
          #qcom-multimedia-proprietary-image-rb3gen2-core-kit.rootfs.qcomflash.tar.gz
          download_filename: qcom-multimedia-proprietary-image-${{ env.IMAGE_NAME }}.rootfs.qcomflash.tar.gz
          location: AudioReach/meta-audioreach/post_merge_build

      - name: Extract image and mount
        id: extract_image
        if: ${{ env.IMAGE_NAME != 'raspberrypi4' }}
        shell: bash
        env:
          IMAGE_NAME_LOCAL: ${{ env.IMAGE_NAME }}
          FILES_TO_COPY: ${{ inputs.files_to_copy }}
          DOCKER_IMAGE: ${{ steps.get-docker-image.outputs.image_name }}
        run: |
          #!/bin/bash
          set -e

          IMAGE_ARCHIVE="qcom-multimedia-proprietary-image-${IMAGE_NAME_LOCAL}.rootfs.qcomflash.tar.gz"
          echo "Extracting the image"
          tar -xvf "$IMAGE_ARCHIVE"
          ROOTFS_IMG=$(tar -tf "$IMAGE_ARCHIVE" | grep 'rootfs.img$')
          ROOTFS_DIR=$(dirname "$ROOTFS_IMG")
          EXPECTED_ROOTFS_DIR="qcom-multimedia-proprietary-image-${IMAGE_NAME_LOCAL}"
          if [ "$ROOTFS_DIR" != "$EXPECTED_ROOTFS_DIR" ] && [ -d "$ROOTFS_DIR" ]; then
            rm -rf "$EXPECTED_ROOTFS_DIR"
            mv "$ROOTFS_DIR" "$EXPECTED_ROOTFS_DIR"
            ROOTFS_DIR="$EXPECTED_ROOTFS_DIR"
            ROOTFS_IMG="$ROOTFS_DIR/rootfs.img"
          fi
          # Export as GitHub Actions environment variables
          echo "ROOTFS_IMG=$ROOTFS_IMG" >> $GITHUB_ENV
          echo "ROOTFS_DIR=$ROOTFS_DIR" >> $GITHUB_ENV
          rm -rf "$IMAGE_ARCHIVE"
          echo "Image extracted successfully"

          ls -l "$ROOTFS_DIR/rootfs.img"

          # Mount on host runner first (container loop/libguestfs is unreliable on some runners),
          # then run only file-copy logic in docker with /tmp/rootfs bind-mounted.
          sudo mkdir -p /tmp/rootfs

          cleanup_mount() {
            if mountpoint -q /tmp/rootfs; then
              sudo umount /tmp/rootfs || sudo guestunmount /tmp/rootfs || true
            fi
          }
          trap cleanup_mount EXIT

          if sudo mount -o loop "$ROOTFS_DIR/rootfs.img" /tmp/rootfs; then
            echo "Image mounted successfully with loop mount"
          else
            echo "Loop mount failed on host, trying guestmount"
            sudo env DEBIAN_FRONTEND=noninteractive apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y libguestfs-tools
            export LIBGUESTFS_BACKEND=direct
            export LIBGUESTFS_BACKEND_SETTINGS=force_tcg
            export LIBGUESTFS_DEBUG=1
            export LIBGUESTFS_TRACE=1

            echo "DEBUG: running guestmount with LIBGUESTFS_DEBUG=1 LIBGUESTFS_TRACE=1"
            if ! sudo -E guestmount -a "$ROOTFS_DIR/rootfs.img" -i --rw /tmp/rootfs; then
              echo "guestmount failed; collecting libguestfs diagnostics"
              sudo -E libguestfs-test-tool || true
              exit 1
            fi
            echo "Image mounted successfully with guestmount"
          fi

          docker run \
            --rm \
            -v $PWD:/workspace \
            -v /tmp/rootfs:/tmp/rootfs \
            -w /workspace \
            -e "FILES_TO_COPY=${FILES_TO_COPY}" \
            "${DOCKER_IMAGE}" \
            bash -c '
              set -xe
              set +e
              copy_output="$(sudo bash -c "source /workspace/${FILES_TO_COPY}" 2>&1)"
              copy_rc=$?
              set -e
              echo "$copy_output"
              if [ "$copy_rc" -ne 0 ]; then
                if echo "$copy_output" | grep -q "cp: cannot stat"; then
                  echo "Optional files missing in ${FILES_TO_COPY}; continuing"
                else
                  exit "$copy_rc"
                fi
              fi
              echo "Build files copied successfully"
              sync
            '

          cleanup_mount
          trap - EXIT
          echo "Image unmounted successfully"
          ls -l "$ROOTFS_DIR/rootfs.img"

      - name: Create tar image for qcomflash directory
        id: create_tar_image
        if: ${{ env.IMAGE_NAME != 'raspberrypi4' }}
        shell: bash
        env:
          IMAGE_NAME_LOCAL: ${{ env.IMAGE_NAME }}
          ROOTFS_DIR_LOCAL: ${{ env.ROOTFS_DIR }}
        run: |
          #!/bin/bash
          set -e
          echo $PWD
          echo "Creating tar image for qcomflash directory"
          tar -czvf "qcom-multimedia-proprietary-image-${IMAGE_NAME_LOCAL}.rootfs.qcomflash.tar.gz" "${ROOTFS_DIR_LOCAL}/"

      # ✅ Moving newly created tar files into presigned_urls path
      - name: Move tar to presigned_urls directory
        if: ${{ env.IMAGE_NAME != 'raspberrypi4' }}
        shell: bash
        env:
          WORKSPACE_DIR: ${{ github.workspace }}
          IMAGE_NAME_LOCAL: ${{ env.IMAGE_NAME }}
        run: |
          set -e
          mkdir -p "${WORKSPACE_DIR}/presigned_urls"

          FILE="qcom-multimedia-proprietary-image-${IMAGE_NAME_LOCAL}.rootfs.qcomflash.tar.gz"


          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found!"
            exit 1
          fi

          mv "$FILE" "${WORKSPACE_DIR}/presigned_urls/"
          echo "Moved $FILE to presigned_urls/"

      - name: Upload tar image
        id: upload_tar_image
        if: ${{ env.IMAGE_NAME != 'raspberrypi4' }}
        uses: AudioReach/audioreach-workflows/.github/actions/aws-s3-exchanger@master
        with:
          s3_bucket: qli-prd-audior-gh-artifacts
          local_file: ${{ github.workspace }}/presigned_urls/qcom-multimedia-proprietary-image-${{ env.IMAGE_NAME }}.rootfs.qcomflash.tar.gz
          mode: upload

